name: Keep scraper server awake

# Render's free plan spins the service down after 15 minutes of no
# incoming traffic; the next real request then pays a 30-60s cold-start
# penalty. Pinging /health every 10 minutes (well under that 15 minute
# window) keeps the service warm so real "Compare Price" clicks always
# hit an already-running server. This costs nothing — GitHub Actions
# gives free minutes for public/private repos, and a plain curl to a
# health endpoint takes a couple of seconds.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # continue-on-error: a cold-start ping timing out occasionally is
      # expected/harmless (that's the whole point of this job — the very
      # thing it's guarding against), so it shouldn't count as a failed
      # GitHub Actions run and spam an email every time. The ping still
      # runs every 10 minutes either way; this only silences the noisy
      # "workflow failed" notification when a single ping doesn't land.
      - name: Ping /health
        continue-on-error: true
        run: curl -fsS --max-time 30 "https://watchora-scraper-server-5u3a.onrender.com/health"
